name: Update poetry index

on:
  push:
    paths:
      - 'poetry/**'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  index:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Build poetry/index.json (newest first)
        run: |
          python3 - <<'EOF'
          import json, os, re, subprocess
          from datetime import datetime, timezone
          items = []
          for f in os.listdir('poetry'):
              if not f.lower().endswith(('.txt', '.md')):
                  continue
              m = re.match(r'(\d{4})-(\d{2})-(\d{2})[_ -]', f)
              if m:   # a date typed at the start of the file name wins
                  d = datetime(int(m[1]), int(m[2]), int(m[3]), 12, 0, tzinfo=timezone.utc)
              else:   # otherwise: when the file was first committed
                  out = subprocess.run(['git', 'log', '--diff-filter=A', '--format=%at', '--', 'poetry/' + f],
                                       capture_output=True, text=True).stdout.split()
                  d = datetime.fromtimestamp(int(out[-1]), tz=timezone.utc) if out else datetime(1970, 1, 1, tzinfo=timezone.utc)
              items.append({'file': f, 'added': d.strftime('%Y-%m-%dT%H:%M:%SZ')})
          items.sort(key=lambda x: (x['added'], x['file']), reverse=True)
          json.dump(items, open('poetry/index.json', 'w'), indent=1)
          EOF
      - name: Commit index
        run: |
          git config user.name "github-actions"
          git config user.email "github-actions@users.noreply.github.com"
          git add poetry/index.json
          if ! git diff --cached --quiet; then
            git commit -m "Update poetry index"
            git push
          fi
