  <button id="lb-close" aria-label="Close">&times;</button>
  <button id="lb-prev" aria-label="Previous">&#8249;</button>
  <img id="lb-img" alt="">
  <button id="lb-next" aria-label="Next">&#8250;</button>
</div>
<script>
/* Put images in the "sketches" folder, then paste the file names into this list. */
  const sketches = [
  "Akshita 1.jpg",
  "Andrew Scott 1.1.jpg",
  "Benedict Cumberbatch 1.1.jpg",
  "Captain Hook and Emma Swan 1.png",
  "Cara Delevingne 1.jpg",
  "Death 1.png",
  "Divya 1.png",
  "EmilyK1.2.png",
  "Emma Watson 1.png",
  "Felicity Jones 1.png",
  "Gandhi 1.1.png",
  "Garima 1.2.png",
  "Garima 3.png",
  "Girl 1.png",
  "Girl 10.jpg",
  "Girl 14.1.png",
  "Girl 15.1.png",
  "Girl 16.1.png",
  "Girl 17.jpeg",
  "Girl 18.jpeg",
  "Girl 9.jpg",
  "Guy 1.png",
  "Jack and Rose 1.jpg",
  "Jenna Coleman 1.png",
  "Jenna Coleman 2.jpg",
  "Keanu Reeves 1.png",
  "Kiss 1.png",
  "Kiss 3.png",
  "Lenin Marx 1.1.png",
  "Lily 4.3.png",
  "Loki 1.png",
  "Peggy Carter 1.2.png",
  "Rachel 1.1.png",
  "Raga 1.5.4.png",
  "Raga 2.1.png",
  "Romantic 1.png",
  "Romantic 10.png",
  "Romantic 11.png",
  "Romantic 15.png",
  "Romantic 2.png",
  "Romantic 3.png",
  "Romantic 4.png",
  "Romantic 6.2.png",
  "Romantic 7.png",
  "Scarlett Johansson 1.png",
  "SecretaryKim 01.png",
  "Star Wars 1.png",
  "Star Wars 2.png",
  "Taylor Swift 2.png",
  "Taylor Swift 3.jpeg",
  "Unknown Lady 1.jpg",
  "Yi 1.png"
];
const PAGE = 12;
const grid = document.getElementById("sketch-grid");
const moreBtn = document.getElementById("load-more");
const lb = document.getElementById("lightbox");
const lbImg = document.getElementById("lb-img");
let current = 0, shown = 0;
function loadMore(){
  sketches.slice(shown, shown + PAGE).forEach((file, k) => {
    const i = shown + k;
    const b = document.createElement("button");
    b.setAttribute("aria-label", "Open sketch " + (i + 1));
    const img = document.createElement("img");
    img.src = "sketches/" + encodeURI(file);
    img.loading = "lazy";
    img.alt = "Sketch " + (i + 1);
    b.appendChild(img);
    b.onclick = () => show(i);
    grid.appendChild(b);
  });
  shown = Math.min(shown + PAGE, sketches.length);
  moreBtn.textContent = "Load more (" + (sketches.length - shown) + " left)";
  if (shown >= sketches.length) moreBtn.style.display = "none";
}
moreBtn.onclick = loadMore;
loadMore();
function show(i){
  current = (i + sketches.length) % sketches.length;
  lbImg.src = "sketches/" + encodeURI(sketches[current]);
  lb.classList.add("open");
}
function close(){ lb.classList.remove("open"); }
document.getElementById("lb-close").onclick = close;
document.getElementById("lb-prev").onclick = () => show(current - 1);
document.getElementById("lb-next").onclick = () => show(current + 1);
lb.onclick = e => { if (e.target === lb) close(); };
document.addEventListener("keydown", e => {
  if (!lb.classList.contains("open")) return;
  if (e.key === "Escape") close();
  if (e.key === "ArrowLeft") show(current - 1);
  if (e.key === "ArrowRight") show(current + 1);
});
</script>
<script src="site.js"></script>
</body>
</html>
